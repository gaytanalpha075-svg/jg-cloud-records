<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catalog | JG Cloud Records</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <div class="logo">JG</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="catalog.html">Catalog</a>
        </div>
    </nav>


    <main class="catalog-page">

        <section class="catalog-header">

            <p class="section-label">The Collection</p>

            <h1>Browse Records</h1>

            <p>
                Explore albums from five different genres and discover
                records from some of the most influential artists.
            </p>

        </section>


        <div class="genre-navigation">

            <a href="#rock">Rock</a>
            <a href="#hiphop">Hip-Hop</a>
            <a href="#pop">Pop</a>
            <a href="#latin">Latin</a>
            <a href="#rnb">R&B</a>

        </div>


        <section id="catalog-container">

            <!-- JavaScript will load the albums here -->

        </section>

        <section id="catalog-container">

    <!-- JavaScript will load the albums here -->

</section>


<section class="order-section" id="order-section">

    <p class="section-label">Order</p>
    <h2>Complete Your Order</h2>

    <p class="selected-album-text">
        Selected Album:
        <span id="selected-album">None</span>
    </p>

    <form id="order-form">

        <div class="form-group">
            <label for="customer-name">Name</label>
            <input
                type="text"
                id="customer-name"
                placeholder="Your name"
                required
            >
        </div>

        <div class="form-group">
            <label for="customer-email">Email</label>
            <input
                type="email"
                id="customer-email"
                placeholder="example@email.com"
                required
            >
        </div>

        <button type="submit" class="order-button">
            Place Order
        </button>

    </form>

    <p id="order-message"></p>

</section>

    </main>


    <footer>
        <p>JG Cloud Records</p>
    </footer>


    <script src="js/script.js?v=4"></script>

</body>

</html>
