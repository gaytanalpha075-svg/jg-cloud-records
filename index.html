<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JG Cloud Records</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <div class="logo">JG</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="catalog.html">Catalog</a>
        </div>
    </nav>


    <main>

        <section class="hero">

            <p class="hero-label">Welcome to</p>

            <h1>JG Cloud Records</h1>

            <p class="hero-description">
                Discover albums across different genres and artists.
                Browse the collection and find your next favorite record.
            </p>

            <a href="catalog.html" class="browse-button">
                Browse Collection
            </a>

        </section>


        <section class="genres">

            <p class="section-label">Explore</p>

            <h2>Browse by Genre</h2>


            <div class="genre-grid">

                <a href="catalog.html?genre=rock" class="genre-card">
                    <span>Rock</span>
                </a>

                <a href="catalog.html?genre=hiphop" class="genre-card">
                    <span>Hip-Hop</span>
                </a>

                <a href="catalog.html?genre=pop" class="genre-card">
                    <span>Pop</span>
                </a>

                <a href="catalog.html?genre=latin" class="genre-card">
                    <span>Latin</span>
                </a>

                <a href="catalog.html?genre=rnb" class="genre-card">
                    <span>R&B</span>
                </a>

            </div>

        </section>

    </main>


    <footer>
        <p>JG Cloud Records</p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
